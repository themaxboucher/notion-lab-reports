name: Claude

# Starts Claude Code when:
# - an issue is opened with the "claude" label (the issue template adds it) or mentions @claude
# - a comment, PR review, or line comment mentions @claude
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
          claude_args: |
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --append-system-prompt "When working on an issue: implement it, then run npm run check, npm run typecheck, and npm test and fix any failures. Push your branch and open a pull request against main with gh pr create; the PR body must include 'Closes #<issue number>'. When responding to review comments on a pull request: address every comment, re-run the same checks, and push to the pull request's existing branch."
